version: '3.8'
services:
  frontend:
    container_name: movie-app-frontend
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - docker/.env
    restart: unless-stopped

  backend:
    container_name: movie-app-backend
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./server/ml_scripts/models:/app/server/ml_scripts/models
    env_file:
      - docker/.env
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PYTHONUNBUFFERED=1
      - MONGODB_URI=${MONGODB_URI}
